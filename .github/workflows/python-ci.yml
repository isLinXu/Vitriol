name: Python CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 26.04 no longer has setup-python builds for Python 3.9.
        os: [ubuntu-24.04]
        python-version: ['3.9', '3.10', '3.11', '3.12']
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz,api]"
          
      - name: Lint governance layer with ruff
        run: |
          ruff check \
            src/vitriol/api/server.py \
            src/vitriol/cli/main.py \
            src/vitriol/config \
            src/vitriol/security \
            src/vitriol/utils/hf_loading.py \
            tests/test_api_server.py \
            --output-format=github
        
      - name: Type check governance layer with mypy
        run: |
          mypy \
            src/vitriol/api/server.py \
            src/vitriol/cli/main.py \
            src/vitriol/security/context.py \
            --ignore-missing-imports \
            --follow-imports=skip

      - name: Advisory full lint
        run: |
          ruff check src/ tests/ --output-format=github
        continue-on-error: true

      - name: Advisory focused legacy type check
        run: |
          mypy src/vitriol/core/generator.py src/vitriol/core/validator.py --ignore-missing-imports
        continue-on-error: true
        
      - name: Run tests with coverage
        run: |
          pytest tests/ -v --ignore=tests/integration --tb=short --maxfail=5 \
            --cov=src/vitriol --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=60 --junitxml=test-results.xml
        env:
          PYTHONPATH: src

      - name: Report test failures
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("test-results.xml")
          if report.exists():
              for case in ET.parse(report).iter("testcase"):
                  for result in case:
                      if result.tag in {"failure", "error"}:
                          name = f"{case.get('classname', '')}.{case.get('name', '')}"
                          message = name + "\n" + (result.text or result.get("message", ""))[-4000:]
                          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                          print(f"::error title=pytest failure::{message}")
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Generate coverage badge
        run: |
          python -m pip install coverage-badge
          coverage-badge -o coverage.svg -f
        continue-on-error: true
          
      - name: Test CLI commands
        run: |
          python -m vitriol --version
          python -m vitriol --help
          python -m vitriol check --help
          python -m vitriol cis rank --help
          python -m vitriol generate --help
        env:
          PYTHONPATH: src

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build
          
      - name: Build distribution
        run: |
          python -m build
          
      - name: Check distribution
        run: |
          ls -lh dist/
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
